services:
  family-dashboard:
    image: family-dashboard:c4-amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
      - push.env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/family-dashboard", "--check-db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
