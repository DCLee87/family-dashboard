services:
  family-dashboard:
    image: family-dashboard:e2-amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FAMILY_DASHBOARD_ADDRESS: ":8080"
      FAMILY_DASHBOARD_DATA_DIR: "/data"
      FAMILY_DASHBOARD_LOCAL_NETWORKS: "${FAMILY_DASHBOARD_LOCAL_NETWORKS:-}"
      FAMILY_DASHBOARD_SECURE_COOKIES: "${FAMILY_DASHBOARD_SECURE_COOKIES:-true}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "/family-dashboard", "--check-db" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
