services:
  family-dashboard:
    build:
      context: .
      args:
        VERSION: e1-local
    image: family-dashboard:e1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FAMILY_DASHBOARD_ADDRESS: ":8080"
      FAMILY_DASHBOARD_DATA_DIR: "/data"
    volumes:
      - ./runtime/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "/family-dashboard", "--check-db" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
